<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosca Voadora</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(1200px 700px at 30% 10%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(900px 600px at 85% 90%, rgba(200,215,235,.7), transparent 60%),
      linear-gradient(160deg, #e8eef5 0%, #dfe7f0 45%, #cfdae7 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    cursor: crosshair;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(30,45,60,.16) 100%);
  }

  #fly {
    position: fixed;
    left: 0;
    top: 0;
    width: 96px;
    height: 96px;
    transform: translate3d(-200px, -200px, 0);
    will-change: transform;
    filter: drop-shadow(0 10px 10px rgba(20,30,40,.18));
    z-index: 5;
  }
  #fly svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .wing {
    transform-box: view-box;
    fill: rgba(225, 240, 255, .62);
    stroke: rgba(120, 145, 170, .85);
    stroke-width: 1.4;
  }
  .wing-l { transform-origin: 47px 43px; animation: flapL var(--flap, .08s) linear infinite; }
  .wing-r { transform-origin: 53px 43px; animation: flapR var(--flap, .08s) linear infinite; }
  @keyframes flapL {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(-16deg) scaleY(.42); }
  }
  @keyframes flapR {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(16deg) scaleY(.42); }
  }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,.82);
    color: #33475b;
    font-size: 14px;
    letter-spacing: .01em;
    box-shadow: 0 6px 20px rgba(40,60,80,.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity .5s ease, transform .5s ease;
    z-index: 10;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }

  #sound {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    padding: 9px 15px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.82);
    color: #33475b;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(40,60,80,.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .15s ease, background .2s ease;
  }
  #sound:hover { transform: translateY(-1px); background: #fff; }
  #sound:active { transform: translateY(0) scale(.97); }
  #sound.muted { color: #8a97a5; }
</style>
</head>
<body>

<div id="fly" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <!-- asas (atrás do corpo) -->
    <g class="wing wing-l">
      <ellipse cx="34" cy="32" rx="20" ry="8.5" transform="rotate(-38 34 32)"/>
    </g>
    <g class="wing wing-r">
      <ellipse cx="66" cy="32" rx="20" ry="8.5" transform="rotate(38 66 32)"/>
    </g>

    <!-- patas -->
    <g fill="none" stroke="#22282e" stroke-width="2.2" stroke-linecap="round">
      <path d="M42 47 L31 55 L26 63"/>
      <path d="M44 52 L35 63 L31 72"/>
      <path d="M47 55 L43 68 L42 76"/>
      <path d="M58 47 L69 55 L74 63"/>
      <path d="M56 52 L65 63 L69 72"/>
      <path d="M53 55 L57 68 L58 76"/>
    </g>

    <!-- abdômen -->
    <ellipse cx="50" cy="63" rx="12" ry="17" fill="#33383e"/>
    <ellipse cx="50" cy="63" rx="12" ry="17" fill="none" stroke="#1d2126" stroke-width="1.2"/>
    <path d="M39 57 Q50 61 61 57" fill="none" stroke="#1d2126" stroke-width="1.6" opacity=".8"/>
    <path d="M38 66 Q50 70 62 66" fill="none" stroke="#1d2126" stroke-width="1.6" opacity=".6"/>

    <!-- tórax -->
    <ellipse cx="50" cy="44" rx="13" ry="12" fill="#454b52"/>
    <ellipse cx="50" cy="44" rx="13" ry="12" fill="none" stroke="#24282d" stroke-width="1.2"/>
    <path d="M37 41 Q50 45 63 41" fill="none" stroke="#24282d" stroke-width="1.4" opacity=".7"/>

    <!-- cabeça e olhos -->
    <circle cx="50" cy="28" r="9" fill="#2c3137"/>
    <ellipse cx="45.8" cy="26.5" rx="4.6" ry="5.4" fill="#b8402f"/>
    <ellipse cx="54.2" cy="26.5" rx="4.6" ry="5.4" fill="#b8402f"/>
    <circle cx="44.4" cy="24.8" r="1.5" fill="#f0b9ae" opacity=".9"/>
    <circle cx="52.8" cy="24.8" r="1.5" fill="#f0b9ae" opacity=".9"/>
  </svg>
</div>

<button id="sound" type="button" aria-label="Ligar ou desligar o som">🔊 Som</button>
<div id="hint">Clique em qualquer lugar para ouvir o zumbido 🪰</div>

<script>
(() => {
  'use strict';

  const fly = document.getElementById('fly');
  const hint = document.getElementById('hint');
  const soundBtn = document.getElementById('sound');

  const TAU = Math.PI * 2;
  const HALF = 48; // metade do tamanho da mosca (96px)
  const PAD = 50;  // margem para a mosca não encostar nas bordas

  let W = window.innerWidth;
  let H = window.innerHeight;

  let x = W * 0.5;
  let y = H * 0.45;
  let vx = 0;
  let vy = 0;
  let tx = x;
  let ty = y;
  let angle = 0;
  let t = 0;
  let speed = 0;
  let excite = 0;
  let flapDur = 0.08;

  const phase = [
    Math.random() * TAU,
    Math.random() * TAU,
    Math.random() * TAU,
    Math.random() * TAU
  ];

  function pickTarget() {
    tx = PAD + Math.random() * Math.max(1, W - PAD * 2);
    ty = PAD + Math.random() * Math.max(1, H - PAD * 2);
  }
  pickTarget();

  /* ------------------------------------------------------------------ *
   *  Áudio: zumbido sintetizado com Web Audio API                      *
   *  (osciladores + ruído + tremulação + pan conforme a posição)       *
   * ------------------------------------------------------------------ */

  let audio = null;
  let muted = false;

  function makeNoiseBuffer(ctx) {
    const len = Math.floor(ctx.sampleRate * 1.5);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function initAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

    const ctx = new AC();

    const master = ctx.createGain();
    master.gain.value = 0;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 4;

    master.connect(comp);
    comp.connect(ctx.destination);

    // Tom principal do zumbido: dois osciladores levemente desafinados
    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = 185;

    const osc2 = ctx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.value = 187;

    const osc2Gain = ctx.createGain();
    osc2Gain.gain.value = 0.32;

    const tone = ctx.createGain();
    tone.gain.value = 0.55;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1500;
    lp.Q.value = 0.8;

    const buzz = ctx.createGain();
    buzz.gain.value = 0.5;

    osc1.connect(tone);
    osc2.connect(osc2Gain);
    osc2Gain.connect(tone);
    tone.connect(lp);
    lp.connect(buzz);

    // Tremulação rápida das asas (modulação de amplitude)
    const flutter = ctx.createOscillator();
    flutter.type = 'sine';
    flutter.frequency.value = 26;
    const flutterAmt = ctx.createGain();
    flutterAmt.gain.value = 0.2;
    flutter.connect(flutterAmt);
    flutterAmt.connect(buzz.gain);

    // Vibrato leve para o tom "vivo"
    const vib = ctx.createOscillator();
    vib.frequency.value = 7.5;
    const vibAmt = ctx.createGain();
    vibAmt.gain.value = 24;
    vib.connect(vibAmt);
    vibAmt.connect(osc1.frequency);
    vibAmt.connect(osc2.frequency);

    // Ruído agudo = sopro das asas
    const noise = ctx.createBufferSource();
    noise.buffer = makeNoiseBuffer(ctx);
    noise.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 4300;
    bp.Q.value = 1.6;
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.05;
    noise.connect(bp);
    bp.connect(noiseGain);

    // Posição estéreo segue o x da mosca
    const panner = typeof ctx.createStereoPanner === 'function'
      ? ctx.createStereoPanner()
      : null;

    if (panner) {
      buzz.connect(panner);
      noiseGain.connect(panner);
      panner.connect(master);
    } else {
      buzz.connect(master);
      noiseGain.connect(master);
    }

    [osc1, osc2, vib, flutter, noise].forEach(node => node.start());

    audio = { ctx, master, osc1, osc2, flutter, panner };

    if (ctx.state === 'suspended') ctx.resume();
  }

  function ensureAudio() {
    initAudio();
    if (audio && audio.ctx.state === 'suspended') audio.ctx.resume();
    hint.classList.add('hidden');
  }

  function updateAudio(dt) {
    if (!audio) return;
    const now = audio.ctx.currentTime;
    const sf = Math.min(1, speed / 420); // fator de velocidade

    excite *= Math.exp(-2.6 * dt);

    const volume = muted ? 0 : (0.16 + sf * 0.3 + excite * 0.35);
    audio.master.gain.setTargetAtTime(volume, now, 0.06);

    const f = 160 + sf * 110 + excite * 40;
    audio.osc1.frequency.setTargetAtTime(f, now, 0.05);
    audio.osc2.frequency.setTargetAtTime(f * 1.015 + 2, now, 0.05);
    audio.flutter.frequency.setTargetAtTime(16 + sf * 18, now, 0.08);

    if (audio.panner) {
      audio.panner.pan.setTargetAtTime(
        Math.max(-1, Math.min(1, (x / W) * 1.7 - 0.85)),
        now,
        0.05
      );
    }
  }

  /* ------------------------------------------------------------------ *
   *  Movimento: voo errático com waypoints, ruído e "arrancadas"       *
   * ------------------------------------------------------------------ */

  let last = performance.now();

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;
    t += dt;

    // Persegue um ponto aleatório da tela
    const dx = tx - x;
    const dy = ty - y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist < 70) pickTarget();

    let ax = (dx / dist) * 1100;
    let ay = (dy / dist) * 1100;

    // Ruído em várias frequências: o zig-zag característico
    ax += Math.sin(t * 15.3 + phase[0]) * 1500 + Math.sin(t * 33.7 + phase[1]) * 800;
    ay += Math.cos(t * 12.1 + phase[2]) * 1500 + Math.cos(t * 29.3 + phase[3]) * 800;

    // Arrancadas aleatórias
    if (Math.random() < dt * 0.7) {
      vx += (Math.random() - 0.5) * 1100;
      vy += (Math.random() - 0.5) * 1100;
      if (Math.random() < 0.35) pickTarget();
    }

    vx += ax * dt;
    vy += ay * dt;

    const drag = Math.exp(-2.3 * dt);
    vx *= drag;
    vy *= drag;

    speed = Math.hypot(vx, vy);
    const MAX_SPEED = 540;
    if (speed > MAX_SPEED) {
      vx *= MAX_SPEED / speed;
      vy *= MAX_SPEED / speed;
      speed = MAX_SPEED;
    }

    x += vx * dt;
    y += vy * dt;

    // Quica nas bordas
    if (x < PAD) {
      x = PAD;
      vx = Math.abs(vx) * 0.9;
      tx = Math.max(tx, PAD + 120);
    } else if (x > W - PAD) {
      x = W - PAD;
      vx = -Math.abs(vx) * 0.9;
      tx = Math.min(tx, W - PAD - 120);
    }
    if (y < PAD) {
      y = PAD;
      vy = Math.abs(vy) * 0.9;
      ty = Math.max(ty, PAD + 120);
    } else if (y > H - PAD) {
      y = H - PAD;
      vy = -Math.abs(vy) * 0.9;
      ty = Math.min(ty, H - PAD - 120);
    }

    // Vira a mosca para a direção do voo (com suavização)
    if (speed > 30) {
      const want = Math.atan2(vy, vx) * 180 / Math.PI + 90;
      const diff = ((want - angle + 540) % 360) - 180;
      angle += diff * Math.min(1, dt * 14);
    }

    fly.style.transform =
      'translate3d(' + (x - HALF) + 'px,' + (y - HALF) + 'px,0) rotate(' + angle + 'deg)';

    // Frequência das asas aumenta com a velocidade
    const wantFlap = Math.max(0.042, 0.1 - speed * 0.0001);
    if (Math.abs(wantFlap - flapDur) > 0.004) {
      flapDur = wantFlap;
      fly.style.setProperty('--flap', flapDur.toFixed(3) + 's');
    }

    updateAudio(dt);
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   *  Interação                                                          *
   * ------------------------------------------------------------------ */

  // Clicar na mosca a espanta
  fly.addEventListener('pointerdown', (event) => {
    event.stopPropagation();
    ensureAudio();

    let dx = x - event.clientX;
    let dy = y - event.clientY;
    const d = Math.hypot(dx, dy) || 1;
    vx = (dx / d) * 620;
    vy = (dy / d) * 620;

    pickTarget();
    excite = 1;
  });

  window.addEventListener('pointerdown', ensureAudio);
  window.addEventListener('touchstart', ensureAudio, { passive: true });

  soundBtn.addEventListener('pointerdown', (event) => event.stopPropagation());
  soundBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    ensureAudio();

    muted = !muted;
    soundBtn.textContent = muted ? '🔇 Mudo' : '🔊 Som';
    soundBtn.classList.toggle('muted', muted);

    if (audio) {
      audio.master.gain.setTargetAtTime(muted ? 0 : 0.3, audio.ctx.currentTime, 0.08);
    }
  });

  // Silencia ao trocar de aba
  document.addEventListener('visibilitychange', () => {
    if (audio && document.hidden) {
      audio.master.gain.setTargetAtTime(0, audio.ctx.currentTime, 0.05);
    }
  });

  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
    x = Math.min(Math.max(x, PAD), Math.max(PAD, W - PAD));
    y = Math.min(Math.max(y, PAD), Math.max(PAD, H - PAD));
    pickTarget();
  });

  // Posição inicial antes do primeiro frame (evita "piscar" no canto)
  fly.style.transform =
    'translate3d(' + (x - HALF) + 'px,' + (y - HALF) + 'px,0)';

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
